# Local development only: Postgres and Redis. Never used for staging or production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fides
      POSTGRES_PASSWORD: fides
      POSTGRES_DB: fides
    ports: ["5432:5432"]
    volumes: ["fides-pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
volumes:
  fides-pg:
